name=MomoJoy
version=1.0.0
author=Wooddy
maintainer=Wooddy
sentence=BLE HID gamepad host for ESP32-S3 (ShanWan Q34U "Mode D" / Android BLE HID).
paragraph=Scans for a BLE HID gamepad, bonds with it, reads and parses the HID Report Map at runtime, subscribes to the input reports and decodes them into a normalised gamepad state (sticks -512..511, triggers 0..1023). Only dependency is NimBLE-Arduino. Includes a raw-dump example for calibrating unknown controllers.
category=Communication
url=https://github.com/wooddy/MomoJoy
architectures=esp32
depends=NimBLE-Arduino
includes=MomoJoy.h
