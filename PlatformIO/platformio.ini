; =============================================================================
;  MomoJoy - PlatformIO project
;  ESP32-S3 N16R8 + ShanWan Q34U (mode switch on "D" = Android BLE HID)
;  Framework: Arduino (arduino-esp32) + NimBLE-Arduino
;
;  Build / upload / monitor:
;    pio run -e readall -t upload -t monitor   <- main firmware, prints everything
;    pio run -e rawdump -t upload -t monitor   <- calibration: raw HID bytes
;    pio run -e robot   -t upload              <- motor-control example
;    pio run -e minimal -t upload              <- smallest sketch
;    pio test -e native                        <- unit tests on the PC, no board
;
;  The library source lives in ../Arduino/libraries/MomoJoy so the Arduino IDE
;  and PlatformIO compile the exact same files. There is no second copy.
; =============================================================================

[platformio]
name = MomoJoy
default_envs = readall
src_dir = src
lib_dir = lib

; ---------------------------------------------------------------------------
[esp32s3_base]
platform = espressif32@6.9.0
framework = arduino
board = esp32-s3-devkitc-1

; --- N16R8: 16 MB QIO flash + 8 MB OPI PSRAM ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    ; Serial -> UART0 (GPIO43 TX / GPIO44 RX) -> CH343P USB-serial chip.
    ; Without this, Serial goes to the native USB-OTG port instead.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    ; NimBLE: central role only, one connection - saves RAM and flash.
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_NVS_PERSIST=1
    -std=gnu++17
build_unflags = -std=gnu++11

; Single source of truth for the library (shared with the Arduino IDE tree).
lib_extra_dirs = ${PROJECT_DIR}/../Arduino/libraries

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.3

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize, time
; CH343P: keep DTR/RTS low so opening the monitor does not reset the board.
; Delete these two lines if you prefer an auto-reset on connect.
monitor_rts = 0
monitor_dtr = 0

; ---------------------------------------------------------------------------
[env:readall]
extends = esp32s3_base
build_src_filter = -<*> +<app_readall.cpp>

[env:rawdump]
extends = esp32s3_base
build_src_filter = -<*> +<app_rawdump.cpp>

[env:robot]
extends = esp32s3_base
build_src_filter = -<*> +<app_robot.cpp>

[env:minimal]
extends = esp32s3_base
build_src_filter = -<*> +<app_minimal.cpp>

; ---------------------------------------------------------------------------
; Unit tests for the pure-C++ core (HID parser, scaling, mapping).
; Runs on the host compiler - no ESP32 board required.
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -std=gnu++17
    -I${PROJECT_DIR}/../Arduino/libraries/MomoJoy/src
    -I${PROJECT_DIR}/../Arduino/libraries/MomoJoy/src/core
